<h1>Exo Camera was removed.</h1>
<p>Reopen your call apps so their camera and microphone lists refresh.</p>
<p>Your settings and models are still in <b>~/Library/Application Support/Exo Camera</b>. Move that folder to the Trash if you don't want them.</p>
