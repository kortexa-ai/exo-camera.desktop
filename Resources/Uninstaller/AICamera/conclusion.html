<h1>AI Camera was removed.</h1>
<p>Reopen your call apps so their camera and microphone lists refresh.</p>
<p>If you installed Exo Camera, it already moved your AI Camera settings and models when it first opened. Select <b>Exo Camera</b> and <b>Exo Camera Microphone</b> in your call apps.</p>
<p><a href="https://github.com/kortexa-ai/exo-camera.desktop/blob/main/docs/installation.md">Installation and removal instructions</a></p></html>
