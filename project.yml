name: ExoCamera

options:
  bundleIdPrefix: ai.kortexa
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  projectFormat: xcode15_0
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

packages:
  LlamaFramework:
    path: Packages/LlamaFramework
  WhisperFramework:
    path: Packages/WhisperFramework

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "58"
    CODE_SIGN_STYLE: Automatic
    CLANG_ENABLE_MODULES: true
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: false

targets:
  ExoCameraCore:
    type: framework
    platform: macOS
    sources:
      - path: Sources/ExoCameraCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.kortexa.exocamera.core
        DEFINES_MODULE: true
        SKIP_INSTALL: true
        CODE_SIGNING_ALLOWED: false
        GENERATE_INFOPLIST_FILE: true

  ExoCamera:
    type: application
    platform: macOS
    sources:
      - path: Sources/ExoCameraApp
      - path: Sources/ExoCameraShared
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Resources/Overlay
        buildPhase: resources
      - path: Resources/ThirdParty
        buildPhase: resources
      - path: LICENSE
        buildPhase: resources
      - path: NOTICE
        buildPhase: resources
    configFiles:
      Debug: Config/Local.xcconfig
      Release: Config/Local.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.kortexa.exocamera
        PRODUCT_NAME: Exo Camera
        SWIFT_OBJC_BRIDGING_HEADER: Sources/ExoCameraApp/WhisperBridge.h
        INFOPLIST_FILE: Resources/App/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/App/ExoCamera.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: true
        GENERATE_INFOPLIST_FILE: false
    dependencies:
      - target: ExoCameraCore
      - package: LlamaFramework
        product: LlamaFramework
      - package: WhisperFramework
        product: WhisperFramework
      - sdk: ServiceManagement.framework
      - target: ExoCameraCameraExtension
        embed: true
        codeSign: true
      - target: ExoCameraAudio

  ExoCameraCameraExtension:
    type: system-extension
    platform: macOS
    sources:
      - path: Sources/ExoCameraCameraExtension
      - path: Sources/ExoCameraShared
    configFiles:
      Debug: Config/Local.xcconfig
      Release: Config/Local.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.kortexa.exocamera.camera-extension
        PRODUCT_NAME: ai.kortexa.exocamera.camera-extension
        # Independent of the host: bump only when this component or its shared protocol changes.
        CURRENT_PROJECT_VERSION: "47"
        MARKETING_VERSION: "0.2.0"
        INFOPLIST_FILE: Resources/CameraExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/CameraExtension/ExoCameraCameraExtension.entitlements
        ENABLE_HARDENED_RUNTIME: true
        GENERATE_INFOPLIST_FILE: false
    dependencies:
      - sdk: CoreMediaIO.framework
      - sdk: CoreMedia.framework
      - sdk: CoreVideo.framework
      - sdk: Security.framework
      - sdk: VideoToolbox.framework

  ExoCameraAudio:
    type: bundle
    platform: macOS
    sources:
      - path: Sources/ExoCameraAudioDriver
      - path: Resources/AudioDriver/en.lproj
        buildPhase: resources
      - path: Resources/AudioDriver/APPLE_NULLAUDIO_LICENSE.txt
        buildPhase: resources
    configFiles:
      Debug: Config/Local.xcconfig
      Release: Config/Local.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.kortexa.exocamera.audio.driver
        PRODUCT_NAME: ExoCameraAudioDriver
        CURRENT_PROJECT_VERSION: "13"
        MARKETING_VERSION: "0.2.0"
        INFOPLIST_FILE: Resources/AudioDriver/Info.plist
        GENERATE_INFOPLIST_FILE: false
        WRAPPER_EXTENSION: driver
        INSTALL_PATH: "$(LOCAL_LIBRARY_DIR)/Audio/Plug-Ins/HAL"
        SKIP_INSTALL: true
        CLANG_C_LANGUAGE_STANDARD: c11
        GCC_SYMBOLS_PRIVATE_EXTERN: false
        ENABLE_HARDENED_RUNTIME: true
    dependencies:
      - sdk: CoreAudio.framework
      - sdk: CoreFoundation.framework

  ExoCameraCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/ExoCameraCoreTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.kortexa.exocamera.core-tests
        CODE_SIGNING_ALLOWED: false
    dependencies:
      - target: ExoCameraCore

schemes:
  ExoCamera:
    build:
      targets:
        ExoCamera: all
        ExoCameraCoreTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ExoCameraCoreTests
    archive:
      config: Release
